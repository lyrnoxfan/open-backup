# 每天 00:00 和 12:00（北京时间）把指定仓库的完整 git 历史打成 git bundle，
# gzip 压缩后上传到 WebDAV，并立刻下载回来做恢复校验。
# 文件名：<repo>-YYYYMMDD-HHMM.bundle.gz，旁边附 <同名>.manifest.json（仓库、提交 SHA、文件 sha256）
#
# 旧备份永不删除，只增不减。
#
# 为什么包一层 gzip：部分 WebDAV（例如把 PUT 转交给 HuggingFace 渠道的图床）会把
# 小的裸二进制误判成文本而拒收；.gz 是公认的二进制扩展名，能稳定走 LFS 通道。恢复时 gunzip 即可。
#
# 必填配置（Settings -> Secrets and variables -> Actions）：
#   Variables:
#     BACKUP_SOURCE_OWNER  被备份仓库的所有者（用户名或组织），例如 octocat
#     WEBDAV_URL           上传目录，例如 https://dav.your-domain/dav/backups
#   Secrets:
#     BACKUP_PAT           有 repo 读权限的 PAT，用来 clone 私有仓库
#     WEBDAV_USER          WebDAV 用户名
#     WEBDAV_PASS          WebDAV 密码
# 缺任何一项、或仍是示例值（your-username / example.com），工作流直接失败。

name: repo-backup

on:
  schedule:
    - cron: "0 4,16 * * *" # 每天 12:00 / 00:00（北京时间，UTC+8）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false # 仓库互相独立，一个失败不取消另一个
      max-parallel: 1 # 串行上传，避免服务器并发 PUT 出怪问题
      matrix:
        repo: [AstroPages, Blog-APK]

    env:
      SOURCE_OWNER: ${{ vars.BACKUP_SOURCE_OWNER }}
      WEBDAV_URL: ${{ vars.WEBDAV_URL }}
      REPO_NAME: ${{ matrix.repo }}

    steps:
      - name: Validate configuration
        env:
          BACKUP_PAT: ${{ secrets.BACKUP_PAT }}
          WEBDAV_USER: ${{ secrets.WEBDAV_USER }}
          WEBDAV_PASS: ${{ secrets.WEBDAV_PASS }}
        run: |
          set -euo pipefail
          fail=0
          need() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "::error::缺少必填配置 $name"; fail=1
            elif printf '%s' "$value" | grep -qiE 'your-username|your-webdav|example\.(com|org|net)'; then
              echo "::error::$name 仍是示例值，请改成真实配置"; fail=1
            fi
          }
          need BACKUP_SOURCE_OWNER "$SOURCE_OWNER"
          need WEBDAV_URL "$WEBDAV_URL"
          need BACKUP_PAT "$BACKUP_PAT"
          need WEBDAV_USER "$WEBDAV_USER"
          need WEBDAV_PASS "$WEBDAV_PASS"
          case "$WEBDAV_URL" in
            https://*) ;;
            *) echo "::error::WEBDAV_URL 必须是 https:// 地址"; fail=1 ;;
          esac
          [ "$fail" -eq 0 ] || exit 1
          echo "source: $SOURCE_OWNER/$REPO_NAME"

      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BACKUP_SOURCE_OWNER }}/${{ matrix.repo }}
          token: ${{ secrets.BACKUP_PAT }}
          fetch-depth: 0 # 完整历史：所有分支、标签、全部提交
          path: repo
          persist-credentials: false

      - name: Create and verify git bundle
        run: |
          set -euo pipefail
          cd repo
          # checkout 只建了当前分支，把所有远端分支建成本地分支再打包
          git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
            | grep -vx 'HEAD' | while read -r b; do
              git show-ref --verify --quiet "refs/heads/$b" || git branch --quiet --track "$b" "origin/$b"
            done
          TS=$(TZ=Asia/Shanghai date +"%Y%m%d-%H%M")
          FILE="${REPO_NAME}-${TS}.bundle"
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          git bundle create "../$FILE" --branches --tags
          git bundle verify "../$FILE"
          gzip -9 -c "../$FILE" > "../$FILE.gz"
          test -s "../$FILE.gz"
          HEAD_SHA=$(git rev-parse HEAD)
          git for-each-ref --format='%(objectname) %(refname)' refs/heads refs/tags > ../refs.txt
          python3 - "$SOURCE_OWNER/$REPO_NAME" "$HEAD_SHA" "../$FILE.gz" ../refs.txt > "../$FILE.gz.manifest.json" <<'PY'
          import hashlib, json, sys, os, datetime
          repo, head, path, refs = sys.argv[1:5]
          h = hashlib.sha256(open(path, "rb").read()).hexdigest()
          refs_map = dict(reversed(l.split(" ", 1)) for l in open(refs).read().split("\n") if l)
          print(json.dumps({
              "repository": repo, "head_sha": head, "file": os.path.basename(path),
              "size": os.path.getsize(path), "sha256": h, "refs": refs_map,
              "created_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }, indent=2))
          PY
          echo "repository: $SOURCE_OWNER/$REPO_NAME  head: $HEAD_SHA"
          echo "refs: $(wc -l < ../refs.txt)"
          ls -l "../$FILE.gz"

      - name: Upload to WebDAV
        env:
          WEBDAV_USER: ${{ secrets.WEBDAV_USER }}
          WEBDAV_PASS: ${{ secrets.WEBDAV_PASS }}
        run: |
          set -euo pipefail
          BASE="${WEBDAV_URL%/}"
          put() {
            local f="$1" code
            code=$(curl -sS -m 600 --retry 2 --retry-delay 5 -u "$WEBDAV_USER:$WEBDAV_PASS" \
              -T "$f" -w '%{http_code}' -o /tmp/dav.out "$BASE/$f") || code="curl-error"
            echo "PUT $f -> HTTP $code"
            case "$code" in
              200|201|204) ;;
              *) echo "::error::上传失败 $f (HTTP $code)"; head -c 500 /tmp/dav.out || true; echo; exit 1 ;;
            esac
          }
          put "$FILE.gz"
          put "$FILE.gz.manifest.json"

      - name: Download and restore test
        env:
          WEBDAV_USER: ${{ secrets.WEBDAV_USER }}
          WEBDAV_PASS: ${{ secrets.WEBDAV_PASS }}
        run: |
          set -euo pipefail
          BASE="${WEBDAV_URL%/}"
          T=$(mktemp -d)
          code=$(curl -sS -m 600 -L -u "$WEBDAV_USER:$WEBDAV_PASS" -w '%{http_code}' -o "$T/$FILE.gz" "$BASE/$FILE.gz") || code="curl-error"
          if [ "$code" != "200" ]; then echo "::error::回读备份失败 (HTTP $code)"; exit 1; fi
          want=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["sha256"])' "$FILE.gz.manifest.json")
          got=$(sha256sum "$T/$FILE.gz" | cut -d' ' -f1)
          if [ "$want" != "$got" ]; then echo "::error::回读文件 sha256 不一致"; exit 1; fi
          gunzip -c "$T/$FILE.gz" > "$T/$FILE"
          git init --quiet "$T/verify" && git -C "$T/verify" bundle verify "$T/$FILE"
          git clone --quiet --mirror "$T/$FILE" "$T/restore.git"
          git -C "$T/restore.git" for-each-ref --format='%(objectname) %(refname)' refs/heads refs/tags | sort > "$T/restored-refs.txt"
          sort refs.txt > "$T/expected-refs.txt"
          if ! diff -u "$T/expected-refs.txt" "$T/restored-refs.txt"; then
            echo "::error::恢复出的分支/标签与源仓库不一致"; exit 1
          fi
          git -C "$T/restore.git" fsck --no-progress --connectivity-only
          echo "restore OK: $(wc -l < "$T/restored-refs.txt") refs match"
          rm -rf "$T"
